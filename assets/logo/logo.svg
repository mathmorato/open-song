<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Círculo externo estilizado -->
  <circle cx="20" cy="20" r="18" stroke-dasharray="2 4" opacity="0.4" />
  
  <!-- Formas de onda / Stems se dividindo harmonicamente -->
  <!-- Stem 1: Vocals (Curva Superior) -->
  <path d="M 8 20 C 12 12, 16 12, 20 20 C 24 28, 28 28, 32 20" stroke="currentColor" opacity="0.9" />
  
  <!-- Stem 2: Bass / Beat (Onda Profunda) -->
  <path d="M 8 20 C 14 26, 18 26, 20 20 C 22 14, 26 14, 32 20" stroke="currentColor" opacity="0.7" />
  
  <!-- Barras centrais de separação dinâmica de frequências -->
  <line x1="14" y1="15" x2="14" y2="25" stroke="currentColor" stroke-width="2.2" />
  <line x1="20" y1="9" x2="20" y2="31" stroke="currentColor" stroke-width="2.5" />
  <line x1="26" y1="13" x2="26" y2="27" stroke="currentColor" stroke-width="2.2" />
</svg>
